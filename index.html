<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachinder</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header__container">
                <div class="header__top">
                    <a href="#" class="header__logo">Teachinder</a>
                    <form action="" method="get" class="header__search">
                      <input type="search" name="query" class="header__search-input"
                             placeholder="Name, note or age to search" aria-label="Search teachers">
                      <button type="submit" class="button">Search</button>
                    </form>
                  </div>
                <div class="header__bottom">
                    <nav class="header__nav">
                        <ul>
                            <li>
                                <a href="#">Teachers</a>
                            </li>
                            <li>
                                <a href="#">Statistics</a>
                            </li>
                            <li>
                                <a href="#">Favourites</a>
                            </li>
                            <li>
                                <a href="#">About</a>
                            </li>
                        </ul>
                    </nav>
                    <button type="button" class="button header__button">Add teacher</button>
                </div>
            </div>
        </header>
        <main class="main">
            <section class="top-teachers">
                <div class="top-teachers__container">
                    <h2>Top Teachers</h2>
                    <header class="top-teachers__header">
                        <form class="top-teachers__filters">
                            <div class="top-teachers__filter">
                                <label for="filter-age">Age</label>
                                <select id="filter-age" name="age">
                                    <option value="18-31">18-31</option>
                                    <option value="32-45">32-45</option>
                                    <option value="46-60">46-60</option>
                                    <option value="61+">61+</option>
                                </select>
                            </div>
                            <div class="top-teachers__filter">
                                <label for="filter-region">Region</label>
                                <select id="filter-region" name="region">
                                    <option value="europe">Europe</option>
                                    <option value="asia">Asia</option>
                                    <option value="americas">Americas</option>
                                    <option value="africa">Africa</option>
                                    <option value="oceania">Oceania</option>
                                </select>
                            </div>
                            <div class="top-teachers__filter">
                                <label for="filter-sex">Sex</label>
                                <select id="filter-sex" name="sex">
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>
                            <div class="top-teachers__filter">
                                <label>
                                    <input type="checkbox" name="photo"> Only with photo
                                </label>
                            </div>
                            <div class="top-teachers__filter">
                                <label>
                                    <input type="checkbox" name="favorites"> Only favorites
                                </label>
                            </div>
                        </form>
                    </header>
                    <div class="top-teachers__cards">
                        <article class="top-teachers__card">
                            <img src="images/teacher.avif" alt="teacher">
                            <div class="top-teachers__info">
                                <div class="top-teachers__name">Ihor <br> Tkachuck</div>
                                <div class="top-teachers__subject">Chemistry</div>
                                <div class="top-teachers__origin">Ukraine</div>
                            </div>
                        </article>
                        <article class="top-teachers__card">
                            <img src="images/teacher.avif" alt="teacher">
                            <div class="top-teachers__info">
                                <div class="top-teachers__name">Ihor <br> Tkachuck</div>
                                <div class="top-teachers__subject">Chemistry</div>
                                <div class="top-teachers__origin">Ukraine</div>
                            </div>
                        </article>
                        <article class="top-teachers__card">
                            <img src="images/teacher.avif" alt="teacher">
                            <div class="top-teachers__info">
                                <div class="top-teachers__name">Ihor <br> Tkachuck</div>
                                <div class="top-teachers__subject">Chemistry</div>
                                <div class="top-teachers__origin">Ukraine</div>
                            </div>
                        </article>
                        <article class="top-teachers__card">
                            <img src="images/teacher.avif" alt="teacher">
                            <div class="top-teachers__info">
                                <div class="top-teachers__name">Ihor <br> Tkachuck</div>
                                <div class="top-teachers__subject">Chemistry</div>
                                <div class="top-teachers__origin">Ukraine</div>
                            </div>
                        </article>
                        <article class="top-teachers__card">
                            <img src="images/teacher.avif" alt="teacher">
                            <div class="top-teachers__info">
                                <div class="top-teachers__name">Ihor <br> Tkachuck</div>
                                <div class="top-teachers__subject">Chemistry</div>
                                <div class="top-teachers__origin">Ukraine</div>
                            </div>
                        </article>
                    </div>
                </div>
            </section>
        </main>
        <footer class="footer">Footer</footer>
    </div>
</body>
</html>
